description: >-
  Persistent Default Layer (pdf) Behavior allows changing the active layer and persists
  the selection to the keyboard's settings, restoring it on boot.
  Similar to QMK's PDF (Persistent Default Layer) function.

compatible: "zmk,behaviour-persistent-default-layer"

include: [base.yaml]

properties:
  default-layer:
    type: int
    required: false
    default: 0
    description: |
      The layer to activate on module initialization if no layer has been
      saved in settings yet. This should be a valid layer number (0-based).
